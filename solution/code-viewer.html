<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Code Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
    }
    
    /* Theme styles */
    body.light { background: #f5f5f7; color: #1d1d1f; }
    body.dark { background: #1d1d1f; color: #f5f5f7; }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
    }
    
    body.light .container { background: #ffffff; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    body.dark .container { background: #2d2d2f; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
    
    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid;
    }
    
    body.light .header { border-color: #e5e5e7; background: #fafafa; }
    body.dark .header { border-color: #3d3d3f; background: #252527; }
    
    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }
    
    .language-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 500;
      text-transform: uppercase;
    }
    
    body.light .language-badge { background: #e8f0fe; color: #1a73e8; }
    body.dark .language-badge { background: #1a3a5c; color: #8ab4f8; }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    body.light .btn { background: #f0f0f0; color: #333; }
    body.dark .btn { background: #3d3d3f; color: #e5e5e7; }
    
    .btn:hover { opacity: 0.8; }
    .btn:active { transform: scale(0.98); }
    
    .btn-primary {
      background: #0071e3 !important;
      color: white !important;
    }
    
    /* Code area */
    .code-wrapper {
      position: relative;
    }
    
    .line-numbers {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 48px;
      padding: 16px 8px;
      text-align: right;
      font-family: 'SF Mono', 'Fira Code', Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
      user-select: none;
    }
    
    body.light .line-numbers { background: #f8f8f8; color: #999; border-right: 1px solid #e5e5e7; }
    body.dark .line-numbers { background: #252527; color: #666; border-right: 1px solid #3d3d3f; }
    
    .code-content {
      margin-left: 48px;
      padding: 16px;
      overflow-x: auto;
    }
    
    pre {
      margin: 0;
      font-family: 'SF Mono', 'Fira Code', Monaco, monospace;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre;
    }
    
    body.light pre { color: #1d1d1f; }
    body.dark pre { color: #e5e5e7; }
    
    /* Syntax highlighting - basic */
    .token-keyword { color: #d73a49; }
    .token-string { color: #22863a; }
    .token-comment { color: #6a737d; font-style: italic; }
    .token-function { color: #6f42c1; }
    .token-number { color: #005cc5; }
    
    body.dark .token-keyword { color: #ff7b72; }
    body.dark .token-string { color: #a5d6ff; }
    body.dark .token-comment { color: #8b949e; }
    body.dark .token-function { color: #d2a8ff; }
    body.dark .token-number { color: #79c0ff; }
    
    /* Footer */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      font-size: 12px;
      border-top: 1px solid;
    }
    
    body.light .footer { border-color: #e5e5e7; background: #fafafa; color: #666; }
    body.dark .footer { border-color: #3d3d3f; background: #252527; color: #999; }
    
    .stats {
      display: flex;
      gap: 16px;
    }
    
    /* Status toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 1000;
    }
    
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    
    .toast.success { background: #34c759; color: white; }
    .toast.error { background: #ff3b30; color: white; }
    
    /* Loading state */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px;
      color: #666;
    }
    
    .loading::after {
      content: "";
      width: 24px;
      height: 24px;
      margin-left: 12px;
      border: 2px solid #ddd;
      border-top-color: #0071e3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="light">
  <div class="container">
    <div class="header">
      <div class="title">
        <span id="title">Code Snippet</span>
        <span class="language-badge" id="language">code</span>
      </div>
      <div class="actions">
        <button class="btn" onclick="copyCode()" id="copyBtn">
          📋 Copy
        </button>
        <button class="btn btn-primary" onclick="insertInChat()">
          💬 Discuss
        </button>
      </div>
    </div>
    
    <div class="code-wrapper" id="codeWrapper">
      <div class="loading" id="loading">Loading code</div>
    </div>
    
    <div class="footer">
      <div class="stats">
        <span id="lineCount">0 lines</span>
        <span id="charCount">0 characters</span>
      </div>
      <span>MCP App Demo</span>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>

  <script>
    // ==========================================================================
    // MCP App Client - Handles communication with goose
    // ==========================================================================
    class McpAppClient {
      constructor() {
        this.pendingRequests = new Map();
        this.requestId = 0;
        this.initialized = false;
        this.hostContext = null;
        
        // Listen for messages from the host (goose)
        window.addEventListener('message', (e) => this.handleMessage(e));
        
        // Initialize the app
        this.initialize();
      }
      
      async initialize() {
        try {
          // Request initialization from host
          const result = await this.request('ui/initialize', {});
          console.log('Initialize result:', JSON.stringify(result, null, 2));
          
          this.hostContext = result.hostContext;
          this.initialized = true;
          
          // Apply theme if available
          if (this.hostContext?.theme) {
            this.applyTheme(this.hostContext.theme);
          }
          
          // Notify host that we're initialized
          this.notify('ui/notifications/initialized', {});
          
          // Tool input comes via ui/notifications/tool-input notification
          // OR it might be in the initialize result - check both places
          if (result.toolInput?.arguments) {
            console.log('Got toolInput from initialize');
            this.onToolInput(result.toolInput);
          }
          
          // Report our initial size
          this.reportSize();
        } catch (error) {
          console.error('Failed to initialize MCP App:', error);
          showToast('Failed to initialize', 'error');
        }
      }
      
      // Handle tool input - called when we receive tool arguments
      onToolInput(toolInput) {
        console.log('onToolInput:', JSON.stringify(toolInput, null, 2));
        const args = toolInput.arguments || toolInput.params?.arguments || toolInput;
        if (args.code !== undefined) {
          renderCode(args);
        }
      }
      
      handleMessage(event) {
        const data = event.data;
        if (!data || typeof data !== 'object') return;
        
        console.log('Received message:', JSON.stringify(data, null, 2));
        
        // Handle responses to our requests
        if ('id' in data && this.pendingRequests.has(data.id)) {
          const { resolve, reject } = this.pendingRequests.get(data.id);
          this.pendingRequests.delete(data.id);
          data.error ? reject(new Error(data.error.message)) : resolve(data.result);
          return;
        }
        
        // Handle tool-input notification - this is how we receive the tool arguments!
        if (data.method === 'ui/notifications/tool-input') {
          console.log('Received tool-input notification');
          this.onToolInput(data.params);
        }
        
        // Handle host-context-changed notifications
        if (data.method === 'ui/notifications/host-context-changed') {
          if (data.params?.theme) {
            this.applyTheme(data.params.theme);
          }
        }
      }
      
      request(method, params) {
        return new Promise((resolve, reject) => {
          const id = ++this.requestId;
          this.pendingRequests.set(id, { resolve, reject });
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
          
          setTimeout(() => {
            if (this.pendingRequests.has(id)) {
              this.pendingRequests.delete(id);
              reject(new Error('Request timed out'));
            }
          }, 30000);
        });
      }
      
      notify(method, params) {
        window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
      }
      
      applyTheme(theme) {
        document.body.className = theme;
      }
      
      reportSize() {
        this.notify('ui/notifications/size-changed', { height: document.body.scrollHeight });
      }
      
      async sendMessageToChat(text) {
        // content must be an array of ContentBlock
        return this.request('ui/message', { content: [{ type: 'text', text }] });
      }
    }
    
    // Create the MCP App client
    const mcpApp = new McpAppClient();
    
    // Store the current code
    let currentCode = '';
    let currentLanguage = 'code';
    
    // ==========================================================================
    // Code Rendering
    // ==========================================================================
    function renderCode({ code, language, title }) {
      currentCode = code || '';
      currentLanguage = language || 'code';
      const lines = currentCode.split('\n');
      
      // Update header
      document.getElementById('title').textContent = title || 'Code Snippet';
      document.getElementById('language').textContent = currentLanguage;
      
      // Generate line numbers
      const lineNumbers = lines.map((_, i) => i + 1).join('\n');
      
      // Basic syntax highlighting
      const highlighted = highlightSyntax(currentCode, currentLanguage);
      
      // Render
      document.getElementById('codeWrapper').innerHTML = `
        <div class="line-numbers">${lineNumbers}</div>
        <div class="code-content">
          <pre>${highlighted}</pre>
        </div>
      `;
      
      // Update stats
      document.getElementById('lineCount').textContent = `${lines.length} lines`;
      document.getElementById('charCount').textContent = `${currentCode.length} characters`;
      
      // Report new size
      mcpApp.reportSize();
    }
    
    // Basic syntax highlighting (simplified)
    function highlightSyntax(code, language) {
      // Escape HTML first
      let escaped = code
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      
      // Apply basic highlighting patterns
      const patterns = [
        // Comments
        { regex: /(\/\/.*$)/gm, class: 'token-comment' },
        { regex: /(\/\*[\s\S]*?\*\/)/g, class: 'token-comment' },
        { regex: /(#.*$)/gm, class: 'token-comment' },
        // Strings
        { regex: /("(?:[^"\\]|\\.)*")/g, class: 'token-string' },
        { regex: /('(?:[^'\\]|\\.)*')/g, class: 'token-string' },
        { regex: /(`(?:[^`\\]|\\.)*`)/g, class: 'token-string' },
        // Keywords
        { regex: /\b(const|let|var|function|return|if|else|for|while|class|import|export|from|async|await|try|catch|throw|new|this|def|self|print|True|False|None)\b/g, class: 'token-keyword' },
        // Numbers
        { regex: /\b(\d+\.?\d*)\b/g, class: 'token-number' },
        // Function calls
        { regex: /\b([a-zA-Z_]\w*)\s*\(/g, class: 'token-function' },
      ];
      
      patterns.forEach(({ regex, class: className }) => {
        escaped = escaped.replace(regex, (match, group) => 
          `<span class="${className}">${group}</span>`
        );
      });
      
      return escaped;
    }
    
    // ==========================================================================
    // Actions
    // ==========================================================================
    function copyCode() {
      // Use a fallback for clipboard API
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentCode)
          .then(() => showToast('Copied to clipboard!', 'success'))
          .catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    }
    
    function fallbackCopy() {
      // Fallback using textarea
      const textarea = document.createElement('textarea');
      textarea.value = currentCode;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast('Copied to clipboard!', 'success');
      } catch (err) {
        showToast('Failed to copy', 'error');
      }
      document.body.removeChild(textarea);
    }
    
    async function insertInChat() {
      if (!currentCode) {
        showToast('No code to discuss', 'error');
        return;
      }
      
      // Ask goose to explain the code using the explain_code tool
      // This will render a step-by-step walkthrough UI
      const message = `Please explain this ${currentLanguage} code step-by-step using the explain_code tool. Break it down into logical sections, explaining what each part does and why.

\`\`\`${currentLanguage}
${currentCode}
\`\`\``;
      
      try {
        await mcpApp.sendMessageToChat(message);
        showToast('Sent to chat!', 'success');
      } catch (error) {
        showToast('Failed: ' + error.message, 'error');
      }
    }
    
    function showToast(message, type) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = 'toast'; }, 2500);
    }
  </script>
</body>
</html>
